services:
  mysql:
    image: mysql/mysql-server:8.0
    environment:
      - MYSQL_PASSWORD=avdb
      - MYSQL_USER=avdb
      - MYSQL_DATABASE=avdb
      - MYSQL_ROOT_PASSWORD=mypw
    ports:
    - "6606:3306"
    # add a volume which inits the database on first run from the avdb_mysql.dump.sql file
    volumes:
    - ./avdb_mysql.dump.sql:/docker-entrypoint-initdb.d/avdb_mysql.dump.sql
