@(inSameHull: List[Dvd])(implicit request: Http.Request, messages: play.i18n.Messages)

@import helpers.EImageSize

<ul class="unstyled">
  @for(otherCopy <- inSameHull) {
    <li>
      @general.displayposter(otherCopy.movie.getId,otherCopy.movie.getHasPoster,EImageSize.TINY)
      @general.displayCopyTitle(otherCopy)
    </li>
  }
</ul>
